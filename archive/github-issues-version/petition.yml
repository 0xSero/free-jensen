name: Petition

on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *" # backstop sweep only; the issue trigger does the real work
  workflow_dispatch:

# Exactly one run at a time. Signatures are processed strictly in sequence.
# (GitHub may drop a *queued* run when another arrives; that's fine because
# every run sweeps ALL open signature issues, not just the one that triggered it.)
concurrency:
  group: petition
  cancel-in-progress: false

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit data/signers.json
      issues: write   # comment, label, close, lock
    outputs:
      added: ${{ steps.decide.outputs.added }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Phase 1: read-only validation, updates local files only.
      - id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DECISIONS: ${{ runner.temp }}/decisions.json
        with:
          script: |
            const { decide } = require('./.github/scripts/process.js');
            await decide({ github, context, core, decisionsPath: process.env.DECISIONS });

      # Phase 2: persist the count. If this fails the job stops and no issue is
      # told "counted"; they all stay open for the next run.
      - name: Commit signatures
        if: steps.decide.outputs.added != '0'
        env:
          ADDED: ${{ steps.decide.outputs.added }}
        run: |
          git config user.name "petition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signers.json
          git commit -m "Count ${ADDED} signature(s)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Phase 3: reply to and close the issues.
      - name: Reply to signers
        if: steps.decide.outputs.decided != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DECISIONS: ${{ runner.temp }}/decisions.json
        with:
          script: |
            const { apply } = require('./.github/scripts/process.js');
            await apply({ github, context, core, decisionsPath: process.env.DECISIONS });

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.decide.outputs.added != '0' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    needs: process
    if: needs.process.outputs.added != '0' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
